{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}StudyFlow{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'studyflow/css/style.css' %}">
</head>
<body class="{% if request.user.is_authenticated and request.user.profile.dark_mode %}dark{% endif %}">
<div class="app-shell">

  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
          <rect x="2" y="5" width="5" height="13" rx="1.5"/>
          <rect x="9" y="2" width="5" height="16" rx="1.5"/>
          <rect x="16" y="7" width="5" height="11" rx="1.5"/>
          <path d="M2 22 Q12 18 22 22"/>
        </svg>
      </div>
      <div>
        <div class="logo-text">Study<span>Flow</span></div>
        <div class="logo-tagline">PLAN · FOCUS · ACHIEVE</div>
      </div>
    </div>

    <a href="{% url 'dashboard' %}" class="nav-item {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Dashboard
    </a>
    <a href="{% url 'task_create' %}" class="nav-item {% if request.resolver_match.url_name == 'task_create' %}active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      New Task
    </a>
    <a href="{% url 'focus' %}" class="nav-item {% if request.resolver_match.url_name == 'focus' %}active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 7 12 12 15 15"/></svg>
      Focus Mode
    </a>

    <div class="nav-divider"></div>

    <a href="{% url 'profile' %}" class="nav-item {% if request.resolver_match.url_name == 'profile' %}active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      Profile
    </a>
    <a href="{% url 'logout' %}" class="nav-item nav-logout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sign Out
    </a>
  </nav>

  <!-- Main content -->
  <main class="main">
    {% if messages %}
      {% for msg in messages %}
        <div class="alert {% if msg.tags == 'success' %}alert-success{% else %}alert-error{% endif %}">{{ msg }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</div>
{% block extra_js %}{% endblock %}
</body>
</html>
