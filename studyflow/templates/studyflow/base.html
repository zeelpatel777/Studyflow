{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}StudyFlow{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'studyflow/css/style.css' %}">
</head>
<body>
<div style="display:flex; min-height:100vh;">

  <!-- SIDEBAR -->
  <nav style="width:220px; background:#ffffff; border-right:1px solid #E2E0F5; padding:24px 16px; display:flex; flex-direction:column; gap:6px; position:fixed; height:100vh; overflow-y:auto;">

    <!-- Logo -->
    <div style="display:flex; align-items:center; gap:10px; padding:8px 12px; margin-bottom:16px;">
      <div style="width:36px; height:36px; background:#534AB7; border-radius:10px; display:flex; align-items:center; justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EEEDFE" stroke-width="2" stroke-linecap="round">
          <rect x="2" y="5" width="5" height="13" rx="1.5"/>
          <rect x="9" y="2" width="5" height="16" rx="1.5"/>
          <rect x="16" y="7" width="5" height="11" rx="1.5"/>
          <path d="M2 22 Q12 18 22 22"/>
        </svg>
      </div>
      <span style="font-size:17px; font-weight:700; color:#1A1A2E;">Study<span style="color:#534AB7;">Flow</span></span>
    </div>

    <a href="{% url 'dashboard' %}" style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; text-decoration:none; font-size:14px; font-weight:500; {% if request.resolver_match.url_name == 'dashboard' %}background:#EEEDFE; color:#534AB7;{% else %}color:#6B6B8A;{% endif %}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Dashboard
    </a>

    <a href="{% url 'task_create' %}" style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; text-decoration:none; font-size:14px; font-weight:500; {% if request.resolver_match.url_name == 'task_create' %}background:#EEEDFE; color:#534AB7;{% else %}color:#6B6B8A;{% endif %}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      New Task
    </a>

    <a href="{% url 'focus' %}" style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; text-decoration:none; font-size:14px; font-weight:500; {% if request.resolver_match.url_name == 'focus' %}background:#EEEDFE; color:#534AB7;{% else %}color:#6B6B8A;{% endif %}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>
      Focus Mode
    </a>

    <div style="height:1px; background:#E2E0F5; margin:8px 0;"></div>

    <a href="{% url 'profile' %}" style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; text-decoration:none; font-size:14px; font-weight:500; {% if request.resolver_match.url_name == 'profile' %}background:#EEEDFE; color:#534AB7;{% else %}color:#6B6B8A;{% endif %}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      Profile
    </a>

    <a href="{% url 'logout' %}" style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; text-decoration:none; font-size:14px; font-weight:500; color:#6B6B8A; margin-top:auto;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sign out
    </a>
  </nav>

  <!-- MAIN CONTENT -->
  <main style="margin-left:220px; flex:1; padding:32px; max-width:900px;">
    {% block content %}{% endblock %}
  </main>

</div>
{% block extra_js %}{% endblock %}
</body>
</html>
