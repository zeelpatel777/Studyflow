{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — StudyFlow</title>
  <link rel="stylesheet" href="{% static 'studyflow/css/style.css' %}">
</head>
<body>
<div class="auth-wrap">
  <div style="width:100%;max-width:420px;padding:24px;">
    <div class="auth-logo">
      <div class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="2" y="5" width="5" height="13" rx="1.5"/><rect x="9" y="2" width="5" height="16" rx="1.5"/><rect x="16" y="7" width="5" height="11" rx="1.5"/><path d="M2 22 Q12 18 22 22"/></svg></div>
      <div><div class="logo-text" style="font-size:22px;">Study<span>Flow</span></div><div class="logo-tagline">PLAN · FOCUS · ACHIEVE</div></div>
    </div>
    <div class="auth-box">
      {% if sent %}
        <div class="success-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#166534" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-5"/></svg>
          Reset link sent! Check your inbox.
        </div>
      {% endif %}
      <h2 class="auth-title">Reset Your Password</h2>
      <p class="auth-sub" style="margin-top:6px;line-height:1.5;">Enter your email and we'll send you a reset link.</p>
      <form method="POST" style="margin-top:20px;">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label">Email address</label>
          <input class="form-input" type="email" name="email" placeholder="Enter your email" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="font-size:15px;padding:14px;">Send Reset Link &nbsp;→</button>
      </form>
      <p style="text-align:center;font-size:13px;margin-top:14px;"><a href="{% url 'login' %}" style="color:#4f46e5;font-weight:500;text-decoration:none;">‹ Back to Login</a></p>
    </div>
  </div>
</div>
</body>
</html>
