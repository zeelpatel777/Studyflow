{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'studyflow/css/style.css' %}">
</head>
<body>
<div class="splash-wrap">
  <div class="splash-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="#EEEDFE" stroke-width="2" stroke-linecap="round">
      <rect x="2" y="4" width="5" height="14" rx="1.5"/>
      <rect x="9.5" y="2" width="5" height="16" rx="1.5"/>
      <rect x="17" y="7" width="5" height="11" rx="1.5"/>
      <path d="M2 22 Q12 18 24 22"/>
    </svg>
  </div>
  <div>
    <h1 class="splash-title">Study<span>Flow</span></h1>
    <p class="splash-sub" style="text-align:center;">study smarter, not harder</p>
  </div>
  <div class="splash-dot"></div>
  <div style="display:flex;gap:12px;margin-top:8px;">
    <a href="{% url 'login' %}" class="btn btn-primary">Sign in</a>
    <a href="{% url 'signup' %}" class="btn btn-outline">Create account</a>
  </div>
</div>
</body>
</html>
