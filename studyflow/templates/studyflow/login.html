{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — StudyFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'studyflow/css/style.css' %}">
</head>
<body>
<div class="auth-wrap">
  <div class="card auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#EEEDFE" stroke-width="2" stroke-linecap="round">
          <rect x="2" y="4" width="5" height="14" rx="1.5"/>
          <rect x="9.5" y="2" width="5" height="16" rx="1.5"/>
          <rect x="17" y="7" width="5" height="11" rx="1.5"/>
          <path d="M2 22 Q12 18 24 22"/>
        </svg>
      </div>
      <h1 class="auth-title">Welcome back 👋</h1>
      <p class="auth-sub">Sign in to continue your study session</p>
    </div>

    {% if error %}
    <div class="error-msg mb-4">{{ error }}</div>
    {% endif %}

    <form method="POST" class="auth-form">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input class="form-input" type="text" id="username" name="username" placeholder="your username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>

    <p class="auth-link mt-4">Don't have an account? <a href="{% url 'signup' %}">Create one</a></p>
  </div>
</div>
</body>
</html>
